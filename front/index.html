<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jtype</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="picker">
        <h1>jtype <small>日本語タイピング</small></h1>

        <div id="modes" role="radiogroup" aria-label="Practice mode">
            <button class="mode" data-mode="dictation" aria-checked="true" role="radio">
                <strong>Dictation</strong>
                <span>Listen, then type what you hear</span>
            </button>
            <button class="mode" data-mode="typing" aria-checked="false" role="radio">
                <strong>Typing</strong>
                <span>Read the kanji, type the reading</span>
            </button>
        </div>

        <ul id="deckList"></ul>
    </section>

    <section id="practice" hidden>
        <header>
            <button id="back" title="Back to decks (Esc)">← decks</button>
            <span id="deckName"></span>
            <span id="modeName"></span>
            <span id="counter"></span>
        </header>

        <main>
            <div id="sentence"></div>
            <div id="typed"></div>
            <div id="translation"></div>
        </main>

        <footer id="legend"></footer>
    </section>

    <section id="finished" hidden>
        <h2>Deck finished</h2>
        <button id="again">Back to decks</button>
    </section>

    <script src="lib/wanakana.min.js"></script>
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
